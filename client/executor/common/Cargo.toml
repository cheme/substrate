[package]
name = "sc-executor-common"
version = "0.10.0-dev"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/substrate/"
description = "A set of common definitions that are needed for defining execution engines."
documentation = "https://docs.rs/sc-executor-common/"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
#pwasm-utils = "0.18.0"
#wasm-instrument = "0.1"
#codec = { package = "parity-scale-codec", version = "3.0.0" }
#sp-core = { version = "6.0.0", path = "../../../primitives/core" }
sp-tasks = { version = "4.0.0-dev", path = "../../../primitives/tasks" }
codec = { package = "parity-scale-codec", version = "3.0.0" }
environmental = "1.1.3"
#thiserror = "1.0.30"
wasm-instrument = "0.1"
wasmer = { version = "2.2", features = ["singlepass"], optional = true }
wasmi = "0.9.1" # TODO is it used
#sc-allocator = { version = "4.1.0-dev", path = "../../allocator" }
sp-maybe-compressed-blob = { version = "4.1.0-dev", path = "../../../primitives/maybe-compressed-blob" } # TODO is it used
sp-sandbox = { version = "0.10.0-dev", path = "../../../primitives/sandbox" }
#sp-serializer = { version = "4.0.0-dev", path = "../../../primitives/serializer" }
sp-wasm-interface = { version = "6.0.0", path = "../../../primitives/wasm-interface" } # TODO is it used

[features]
default = []
wasmer-sandbox = [
	"wasmer",
]
