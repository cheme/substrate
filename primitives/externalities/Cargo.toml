[package]
name = "sp-externalities"
version = "0.12.0"
license = "Apache-2.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
homepage = "https://substrate.io"
repository = "https://github.com/paritytech/substrate/"
description = "Substrate externalities abstraction"
documentation = "https://docs.rs/sp-externalities"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
sp-storage = { version = "6.0.0", path = "../storage", default-features = false }
sp-std = { version = "4.0.0", path = "../std", default-features = false }
tracing = { version = "0.1.29", default-features = false }
environmental = { version = "1.1.3", default-features = false }
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false }
ambassador = "0.2.1"
scale-info = { version = "2.0", default-features = false, features = ["derive"] }
serde = { version = "1.0.136", features = ["derive"], optional = true } # TODO remove (just for logging)

[features]
default = ["std"]
std = [
	"codec/std",
	"environmental/std",
	"serde",
	"scale-info/std",
	"sp-std/std",
	"sp-storage/std",
	"tracing/std",
]
