[package]
name = "kvdb-parity-db"
version = "0.8.0"
authors = ["Parity Technologies <admin@parity.io>"]
description = "Radix tree traits and implementations."
license = "Apache-2.0"
categories = [ "no-std" ]
edition = "2018"


[dependencies]
radix-tree = { version = "0.8.0", path = ".." }
parity-db = { version = "0.3.0", git = "https://github.com/cheme/parity-db", branch = "radix-index" }
codec = { package = "parity-scale-codec", version = "2.0.0", default-features = false, features = ["derive"] }
